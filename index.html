@import url('https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

.pk-root {
  --pitch: #66984A;
  --pitch-2: #517A3A;
  --chalk: #F1F5EA;
  --paper: #FFFFFF;
  --ink: #263323;
  --ink-soft: #66735A;
  --amber: #D3A24C;
  --amber-deep: #B3842E;
  --brick: #B3503F;
  --line: #DCE5CE;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--chalk);
  color: var(--ink);
  min-height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  font-size: 14px;
  line-height: 1.45;
}
.pk-root *, .pk-root *::before, .pk-root *::after { box-sizing: border-box; }
.pk-display { font-family: 'Tinos', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; letter-spacing: 0.01em; }
.pk-mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }

.pk-loading { align-items: center; justify-content: center; gap: 10px; flex-direction: row; padding: 60px 20px; color: var(--ink-soft); }
.pk-spin { animation: pk-spin 0.9s linear infinite; }
@keyframes pk-spin { to { transform: rotate(360deg); } }

.pk-header {
  background: var(--pitch);
  background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 26px, rgba(0,0,0,0.05) 26px, rgba(0,0,0,0.05) 52px);
  color: var(--chalk);
  padding: 18px 18px 12px;
}
.pk-header-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; }
.pk-brand { font-size: 26px; font-weight: 700; color: var(--chalk); }
.pk-season { font-size: 11.5px; color: var(--amber); }
.pk-identity { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(241,245,234,0.75); flex-wrap: wrap; }
.pk-identity-select { background: rgba(0,0,0,0.20); color: #F0F8E4; border: 1px solid rgba(255,255,255,0.32); min-width: 0; flex: 1 1 140px; max-width: 100%; }
.pk-identity-select option { color: var(--ink); }
.pk-add-me-btn { display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,0.14); color: var(--chalk); border: 1px solid rgba(255,255,255,0.32); border-radius: 6px; padding: 6px 9px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
.pk-add-me-btn:hover { background: rgba(255,255,255,0.22); }

.pk-select { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: inherit; padding: 6px 9px; font-size: 13px; box-sizing: border-box; }

.pk-tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--pitch-2); }
.pk-tab {
  background: none; border: none; color: rgba(241,245,234,0.7);
  font-family: 'Inter', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em;
  font-size: 11px; padding: 10px 4px; cursor: pointer; border-bottom: 2.5px solid transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
}
.pk-tab:hover { color: var(--chalk); }
.pk-tab-active { color: var(--amber); border-bottom-color: var(--amber); }
@media (min-width: 600px) {
  .pk-tabs { grid-template-columns: repeat(6, 1fr); }
  .pk-tab { font-size: 12.5px; padding: 11px 10px; letter-spacing: 0.04em; }
}

.pk-main { padding: 16px; flex: 1; max-width: 760px; margin: 0 auto; width: 100%; }

.pk-rules-strip { font-size: 11.5px; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; }
.pk-rules-strip strong { color: var(--ink); }
.pk-info-heading { font-size: 20px; margin-bottom: 6px; }
.pk-info-intro { color: var(--ink-soft); font-size: 13px; margin-bottom: 6px; }
.pk-config-warning { background: var(--brick); color: #fff; font-size: 12.5px; padding: 10px 16px; text-align: center; }
.pk-config-warning code { background: rgba(255,255,255,0.2); padding: 1px 5px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; }
.pk-crash-screen { max-width: 420px; margin: 60px auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 20px; }
.pk-crash-screen .pk-hint { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; word-break: break-word; }

.pk-card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.pk-table { width: 100%; border-collapse: collapse; }
.pk-table th { text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.05em; color: var(--ink-soft); padding: 9px 10px; border-bottom: 1.5px solid var(--line); }
.pk-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.pk-table tr:last-child td { border-bottom: none; }
.pk-num { text-align: right; }
.pk-points { font-weight: 700; color: var(--pitch); font-size: 15px; }
.pk-row-me { background: rgba(211,162,76,0.12); }
.pk-you-tag { margin-left: 6px; font-size: 9.5px; background: var(--amber); color: var(--pitch); padding: 1px 6px; border-radius: 999px; font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.04em; vertical-align: middle; }
.pk-trophy { color: var(--amber-deep); }

.pk-empty-state { text-align: center; padding: 48px 20px; color: var(--ink-soft); }
.pk-empty-icon { color: var(--ink-soft); margin-bottom: 10px; display: flex; justify-content: center; }
.pk-empty-title { font-size: 16px; color: var(--ink); margin-bottom: 6px; }

.pk-gw-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.pk-icon-btn { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); flex: 0 0 auto; }
.pk-icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.pk-gw-label { text-align: center; }
.pk-gw-title { font-size: 15px; }
.pk-gw-sub { font-size: 11px; color: var(--ink-soft); }
.pk-gw-label .pk-gw-sub { margin-top: 2px; display: block; }

.pk-status-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em; font-family: 'Inter', sans-serif; font-weight: 600; }
.pk-status-open { background: rgba(102,152,74,0.16); color: var(--pitch); }
.pk-status-locked { background: rgba(179,80,63,0.12); color: var(--brick); }
.pk-status-complete { background: rgba(102,115,90,0.16); color: var(--ink-soft); }

.pk-banner { background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--ink-soft); padding: 10px 12px; border-radius: 8px; font-size: 12.5px; margin-bottom: 14px; color: var(--ink-soft); }
.pk-banner-warn { border-left-color: var(--brick); color: var(--brick); }

.pk-matches { display: flex; flex-direction: column; gap: 10px; }
.pk-match-card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.pk-team-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: transparent; border: 1.5px solid transparent; border-radius: 8px; padding: 9px 10px; cursor: pointer;
  color: var(--ink);
}
.pk-team-btn:hover:not(:disabled) { background: rgba(102,152,74,0.08); }
.pk-team-selected { border-color: var(--amber); background: rgba(211,162,76,0.12); }
.pk-team-blocked { opacity: 0.4; }
.pk-team-btn:disabled { cursor: not-allowed; }
.pk-swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.pk-team-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.pk-team-name { font-size: 13.5px; font-weight: 600; }
.pk-team-sub { font-size: 10.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pk-team-check { color: var(--amber-deep); flex: 0 0 auto; }
.pk-team-lock { color: var(--ink-soft); flex: 0 0 auto; }
.pk-match-result { text-align: center; font-size: 11.5px; color: var(--ink-soft); padding-top: 4px; border-top: 1px dashed var(--line); }

.pk-dots { display: inline-flex; gap: 3px; }
.pk-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-soft); opacity: 0.55; }
.pk-dot-filled { background: var(--amber); border-color: var(--amber-deep); opacity: 1; }
.pk-dots-maxed .pk-dot-filled { background: var(--brick); border-color: var(--brick); }

.pk-field { margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.pk-field label { font-size: 12px; color: var(--ink-soft); }

.pk-section-title { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 20px 0 8px; color: var(--ink); }
.pk-section-title:first-child { margin-top: 0; }
.pk-hint { font-family: 'Inter', sans-serif; text-transform: none; letter-spacing: normal; font-size: 11px; color: var(--ink-soft); font-weight: 400; }

.pk-chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; margin-bottom: 8px; }
.pk-chip { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 11.5px; }
.pk-chip-code { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.pk-chip-maxed { background: rgba(179,80,63,0.07); border-color: rgba(179,80,63,0.28); }

.pk-empty-row { text-align: center; color: var(--ink-soft); padding: 16px; font-size: 12.5px; }

.pk-fixture-block { border-bottom: 1px solid var(--line); }
.pk-fixture-header { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 12px 4px; cursor: pointer; color: var(--ink); text-align: left; }
.pk-fixture-date { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
.pk-chevron { margin-left: auto; transition: transform 0.15s ease; color: var(--ink-soft); flex: 0 0 auto; }
.pk-chevron-open { transform: rotate(180deg); }
.pk-fixture-list { padding: 0 4px 12px; display: flex; flex-direction: column; gap: 8px; }
.pk-fixture-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; gap: 8px; }
.pk-fixture-side { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.pk-fixture-side.away { justify-content: flex-end; text-align: right; }
.pk-fixture-score { flex: 0 0 auto; color: var(--ink-soft); min-width: 50px; text-align: center; }

.pk-admin-section { margin-bottom: 26px; }
.pk-add-player { display: flex; gap: 8px; margin-bottom: 10px; }
.pk-input { flex: 1; font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: var(--paper); color: var(--ink); }
.pk-btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 600; border-radius: 7px; padding: 8px 14px; cursor: pointer; border: 1px solid transparent; font-size: 12.5px; }
.pk-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.pk-btn-primary { background: var(--pitch); color: var(--chalk); }
.pk-btn-primary:hover:not(:disabled) { background: var(--pitch-2); }
.pk-btn-secondary { background: var(--paper); color: var(--ink); border-color: var(--line); }
.pk-btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
.pk-btn-danger { background: var(--brick); color: var(--chalk); }
.pk-player-list { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pk-player-list li { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: var(--paper); border-bottom: 1px solid var(--line); font-size: 13px; }
.pk-player-list li:last-child { border-bottom: none; }
.pk-danger-hover { background: transparent; border: none; cursor: pointer; color: var(--ink-soft); padding: 4px; }
.pk-danger-hover:hover { color: var(--brick); }

.pk-override-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12.5px; color: var(--ink-soft); }

.pk-results-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.pk-result-row { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; }
.pk-result-team { flex: 1; min-width: 0; }
.pk-result-team-away { text-align: right; }
.pk-score-input { width: 42px; text-align: center; border: 1px solid var(--line); border-radius: 6px; padding: 5px 2px; font-size: 13px; font-family: 'IBM Plex Mono', monospace; }
.pk-dash { color: var(--ink-soft); }

.pk-modal-backdrop { position: fixed; inset: 0; background: rgba(11,26,20,0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.pk-modal { background: var(--paper); border-radius: 12px; padding: 20px; max-width: 340px; width: 100%; position: relative; }
.pk-modal-close { position: absolute; top: 10px; right: 10px; background: none; border: none; cursor: pointer; color: var(--ink-soft); }
.pk-modal-msg { font-size: 13px; color: var(--ink-soft); margin: 8px 0 16px; }
.pk-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

.pk-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--chalk); padding: 10px 16px; border-radius: 999px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 60; max-width: 90%; text-align: center; }
.pk-toast.error { background: var(--brick); }
.pk-toast.success { background: var(--pitch); }

.pk-pin-gate { max-width: 300px; margin: 44px auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pk-pin-gate-icon { color: var(--ink-soft); margin-bottom: 4px; }
.pk-pin-input { text-align: center; letter-spacing: 0.3em; font-family: 'IBM Plex Mono', monospace; width: 100%; max-width: 200px; }
.pk-pin-error { color: var(--brick); font-size: 12px; margin: 0; }
.pk-lock-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.pk-pin-change { display: flex; flex-direction: column; gap: 8px; max-width: 240px; }
.pk-pin-change-actions { display: flex; justify-content: flex-end; gap: 8px; }
.pk-player-actions { display: flex; align-items: center; gap: 6px; }

@media (max-width: 480px) {
  .pk-main { padding: 12px; }
  .pk-chip-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
}
